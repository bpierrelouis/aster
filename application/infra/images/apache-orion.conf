# Interface React : toute adresse sans fichier correspondant renvoie index.html (navigation react-router) ; pas de liste de dossier
<Directory "/usr/local/apache2/htdocs">
    Options -Indexes
    FallbackResource /index.html
</Directory>

# Ni version ni système annoncés
ServerTokens Prod
ServerSignature Off

# Exécution sans root, système de fichiers en lecture seule : fichier PID dans /tmp (tmpfs de la pile)
PidFile /tmp/httpd.pid

# En-têtes de sécurité de l'interface (les réponses de l'API, dont le PDF et /api/docs, reçoivent ceux d'Helmet) :
# ressources du seul site (scripts, styles et polices construits) ; images data: (icônes SVG intégrées par la construction,
# favicon, flèche des listes) ; styles posés par React via le DOM, non concernés par style-src ; pas d'affichage dans un cadre.
# same-origin et non no-referrer : avec no-referrer, le navigateur envoie « Origin: null » sur chaque requête POST,
# et le serveur refuse alors la déconnexion et les écritures, dont il contrôle l'origine.
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
Header always set X-Frame-Options "DENY"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "same-origin"
