# Interface React : toute adresse sans fichier correspondant renvoie index.html (navigation react-router)
<Directory "/usr/local/apache2/htdocs">
    FallbackResource /index.html
</Directory>

# En-têtes de sécurité de l'interface (les réponses de l'API reçoivent ceux d'Helmet) :
# pas d'affichage dans un cadre tiers, pas de devinette du type, pas de référent transmis à un autre site.
# same-origin et non no-referrer : avec no-referrer, le navigateur envoie « Origin: null » sur chaque requête POST,
# et le serveur refuse alors la déconnexion et les écritures, dont il contrôle l'origine.
Header always set Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
Header always set X-Frame-Options "DENY"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "same-origin"
