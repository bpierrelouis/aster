name: orion

services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: orion
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: orion-local
    ports:
      # Port du poste : ORION_POSTGRES_PORT si un autre PostgreSQL occupe déjà 5432
      - "127.0.0.1:${ORION_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Annuaire local des identités ; Keycloak le fédère (aucun profil ni école n'y est stocké)
  ldap:
    image: osixia/openldap:1.5.0
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: ORION
      LDAP_DOMAIN: orion.demo
      LDAP_ADMIN_PASSWORD: ldap-admin-local
      LDAP_TLS: "false"
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
      - ./ldap/orion-utilisateurs.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-orion-utilisateurs.ldif:ro
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "ou=people,dc=orion,dc=demo", "-D", "cn=admin,dc=orion,dc=demo", "-w", "ldap-admin-local", "-s", "base"]
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: keycloak-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: keycloak-admin-local
      KC_SPI_THEME_STATIC_MAX_AGE: -1
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      # Démonstrateur : jetons « Accès de présentation » sur la page de connexion
      ORION_COMPTES_PRESENTATION: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./keycloak/orion-realm.json:/opt/keycloak/data/import/orion-realm.json:ro
      - ./keycloak/themes/orion-mindef:/opt/keycloak/themes/orion-mindef:ro
    depends_on:
      ldap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/localhost/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      start_period: 40s
      retries: 30

volumes:
  postgres-data:
  ldap-data:
  ldap-config:
