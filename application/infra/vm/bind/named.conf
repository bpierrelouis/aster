// DNS du démonstrateur (dossier d'architecture, § 4.5) : zone orion.internal ;
// les autres noms sont transmis au DNS du réseau de formation.
options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { 127.0.0.1; 172.16.0.0/12; };
    recursion yes;
    allow-recursion { 127.0.0.1; 172.16.0.0/12; };
    forwarders { 172.16.143.251; };
    forward only;
    dnssec-validation no;
};

logging {
    channel fichier {
        file "/var/log/bind/named.log" versions 7 size 10m;
        print-time yes;
        severity info;
    };
    category default { fichier; };
};

zone "orion.internal" {
    type primary;
    file "/etc/bind/orion.internal.zone";
};
