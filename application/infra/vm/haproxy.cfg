# HAProxy d’orion-1 : seule entrée définie dans vm.sh, termine le TLS et joint les services par le réseau overlay.
global
    log stdout format raw local0
    ssl-default-bind-options ssl-min-ver TLSv1.2
    # TLS 1.2 : échange de clé éphémère et chiffrement authentifié seulement
    ssl-default-bind-ciphers ECDHE+AESGCM:ECDHE+CHACHA20

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    default-server init-addr none resolvers docker check inter 5s

# Résolution des instances par le DNS interne de Docker (tasks.<service> : une adresse par instance)
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

# Limitation de débit (réponse 429). Seuils larges : plusieurs utilisateurs d’une école peuvent partager une adresse.
#   limite_ip         toute requête, par adresse : 1 000 requêtes par 10 s (interface, API et rafraîchissements périodiques)
#   limite_connexion  début de connexion ORION et envoi d’un formulaire de connexion Keycloak ou demande de jeton de la console, par adresse : 60 par minute
#   limite_agent      API des postes, par jeton (empreinte de l’en-tête Authorization) : 3 000 requêtes par 10 s (parc entier)
backend limite_ip
    stick-table type ip size 100k expire 1m store http_req_rate(10s)
backend limite_connexion
    stick-table type ip size 100k expire 5m store http_req_rate(1m)
backend limite_agent
    stick-table type integer size 10k expire 1m store http_req_rate(10s)

# Port par défaut : interface, API et connexion (Keycloak : seulement le realm orion et les ressources du thème)
frontend orion
    bind :443 ssl crt /usr/local/etc/haproxy/entree.pem
    # Chemins ambigus refusés avant toute règle (normalize-uri reste expérimental en 3.2) : segments . et .., point ou barre
    # encodés ; /realms/orion/../master ne contourne pas le filtrage, un autre encodage de /realms/ est refusé plus bas
    http-request deny if { path_sub /./ /../ } || { path_end /. /.. } || { path,lower -m sub %2e %2f %5c }
    # En-têtes de relais fournis par le client ignorés : seuls ceux d’HAProxy parviennent aux services
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Host
    http-request del-header X-Forwarded-Port
    http-request del-header X-Real-IP
    http-request del-header Forwarded
    http-request set-header X-Forwarded-Proto https
    http-response set-header Strict-Transport-Security "max-age=31536000"

    http-request deny if METH_TRACE
    http-request track-sc0 src table limite_ip
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 1000 }
    acl connexion_orion path /auth/login
    acl connexion_keycloak path_beg /realms/orion/login-actions/
    http-request track-sc1 src table limite_connexion if connexion_orion || METH_POST connexion_keycloak
    http-request deny deny_status 429 if { sc_http_req_rate(1) gt 60 }
    acl agent path_beg /api/agent/
    http-request track-sc2 req.hdr(authorization),xxh64 table limite_agent if agent
    http-request deny deny_status 429 if { sc_http_req_rate(2) gt 3000 }

    # Keycloak : liste d’autorisation (connexion, déconnexion, jetons et ressources du thème) ; console de compte fermée
    acl keycloak path_beg /realms/orion/ /resources/
    acl compte path_beg /realms/orion/account
    http-request deny if { path_beg /realms/ } !keycloak || compte
    use_backend api if { path_beg /api/ /auth/ } || { path /api } || { path /auth }
    use_backend keycloak if keycloak
    default_backend apache

# Console de Keycloak, sur son propre port, sans filtrage réseau (décision du 13 novembre)
frontend identite_administration
    bind :8444 ssl crt /usr/local/etc/haproxy/entree.pem
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Host
    http-request del-header X-Forwarded-Port
    http-request del-header X-Real-IP
    http-request del-header Forwarded
    http-request set-header X-Forwarded-Proto https
    http-response set-header Strict-Transport-Security "max-age=31536000"
    # Console seulement : realm master ; connexion par formulaire ou par l'endpoint de jeton comptée
    http-request deny if METH_TRACE || { path_beg /realms/ } !{ path_beg /realms/master/ }
    acl connexion_console path_beg /realms/master/login-actions/
    acl jeton_console path /realms/master/protocol/openid-connect/token
    http-request track-sc1 src table limite_connexion if METH_POST connexion_console || METH_POST jeton_console
    http-request deny deny_status 429 if { sc_http_req_rate(1) gt 60 }
    default_backend keycloak

backend apache
    option httpchk GET /
    server-template apache 2 tasks.apache:8080

backend api
    option httpchk GET /api/infos
    server-template api 2 tasks.api:3001

backend keycloak
    server-template keycloak 1 tasks.keycloak:8080
