# HAProxy d’orion-1 : seule entrée définie dans vm.sh, termine le TLS et joint les services par le réseau overlay.
global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    default-server init-addr none resolvers docker check inter 5s

# Résolution des instances par le DNS interne de Docker (tasks.<service> : une adresse par instance)
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

# Port par défaut : interface, API et connexion (Keycloak), console de Keycloak refusée
frontend orion
    bind :443 ssl crt /usr/local/etc/haproxy/entree.pem
    http-request set-header X-Forwarded-Proto https
    http-request deny if { path_beg /admin } || { path_beg /realms/master }
    use_backend api if { path_beg /api/ /auth/ } || { path /api } || { path /auth }
    use_backend keycloak if { path_beg /realms/ /resources/ }
    default_backend apache

# Console de Keycloak, réservée au réseau d’administration
frontend identite_administration
    bind :8444 ssl crt /usr/local/etc/haproxy/entree.pem
    http-request set-header X-Forwarded-Proto https
    default_backend keycloak

backend apache
    option httpchk GET /
    server-template apache 2 tasks.apache:8080

backend api
    option httpchk GET /api/infos
    server-template api 2 tasks.api:3001

backend keycloak
    server-template keycloak 1 tasks.keycloak:8080
