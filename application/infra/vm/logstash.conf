# Collecteur des logs : syslog RFC 5424 sur TCP TLS, un dossier par service et un fichier par jour,
# écrits dans le volume NFS logs-nfs (disque des logs d’orion-10, /srv/orion/logs/conteneurs).
input {
  tcp {
    port => 6514
    ssl_enabled => true
    ssl_certificate => "/run/secrets/collecteur.crt"
    ssl_key => "/run/secrets/collecteur.key"
    ssl_client_authentication => "none"
    codec => line
  }
}

filter {
  # <PRI>1 HORODATAGE HÔTE APPLICATION PID MSGID DONNÉES-STRUCTURÉES MESSAGE ; préfixe de longueur éventuel (RFC 5425)
  grok {
    match => { "message" => "^(?:%{NONNEGINT} )?<%{NONNEGINT}>1 %{NOTSPACE:horodatage} %{NOTSPACE:hote} %{NOTSPACE:conteneur} %{NOTSPACE} %{NOTSPACE} (?:-|\[.*?\]) ?%{GREEDYDATA:texte}" }
  }
  # Conteneur orion_<service>.<instance>.<identifiant>
  grok {
    match => { "conteneur" => "^(?:orion_)?(?<service>[^.]+)" }
  }
  if ![service] { mutate { add_field => { "service" => "inconnu" } } }
}

output {
  file {
    path => "/var/log/orion/%{service}/%{+yyyy-MM-dd}.log"
    codec => line { format => "%{horodatage} %{hote} %{conteneur} %{texte}" }
  }
}
