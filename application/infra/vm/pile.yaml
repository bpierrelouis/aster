# Pile Docker Swarm du démonstrateur sur les sept VM (dossier d'architecture, § 4.5).
# Déployée par deployer.sh, qui fournit ASTER_IMAGES, ASTER_TAG et les empreintes des configurations.

x-journaux: &journaux
  logging:
    driver: syslog
    options:
      syslog-address: tcp+tls://172.16.131.137:6514
      syslog-format: rfc5424
      syslog-tls-ca-cert: /etc/docker/aster-ca.pem
      tag: '{{.Name}}'
      mode: non-blocking

x-relance: &relance
  restart_policy:
    condition: any
    delay: 5s

services:
  haproxy:
    <<: *journaux
    image: haproxy:3.2.16-alpine
    ports:
      - { target: 443, published: 443, mode: host }
      - { target: 8443, published: 8443, mode: host }
      - { target: 8444, published: 8444, mode: host }
    configs:
      - source: haproxy
        target: /usr/local/etc/haproxy/haproxy.cfg
    secrets:
      - source: tls_entree
        target: /usr/local/etc/haproxy/entree.pem
    networks: [aster]
    deploy:
      <<: *relance
      placement: { constraints: [node.hostname == aster-1] }

  apache:
    <<: *journaux
    image: ${ASTER_IMAGES}/aster-web:${ASTER_TAG}
    networks: [aster]
    deploy:
      <<: *relance
      replicas: 2
      placement:
        constraints: [node.labels.aster == sans-donnees]
        max_replicas_per_node: 1

  api:
    <<: *journaux
    image: ${ASTER_IMAGES}/aster-api:${ASTER_TAG}
    environment:
      APP_URL: https://172.16.131.188
      OIDC_ISSUER: https://172.16.131.188:8443/realms/aster
      OIDC_CLIENT_ID: aster-web
      IDENTITY_PROVISIONING: 'true'
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      NODE_EXTRA_CA_CERTS: /etc/ssl/aster/ca.pem
      WEB_URL: http://apache:8080
      LDAP_URL: ldap://ldap:389
      SYSLOG_URL: tcp://172.16.131.137:6514
    secrets:
      - DATABASE_URL
      - OIDC_CLIENT_SECRET
      - SESSION_SECRET
      - AGENT_TOKEN
      - source: keycloak_admin
        target: KEYCLOAK_ADMIN_PASSWORD
      - source: ca
        target: /etc/ssl/aster/ca.pem
    networks: [aster]
    deploy:
      <<: *relance
      replicas: 2
      placement:
        constraints: [node.labels.aster == sans-donnees]
        max_replicas_per_node: 1

  postes:
    <<: *journaux
    image: ${ASTER_IMAGES}/aster-postes:${ASTER_TAG}
    environment:
      ASTER_API: http://api:3001
    secrets: [AGENT_TOKEN]
    networks: [aster]
    deploy:
      <<: *relance
      placement: { constraints: [node.labels.aster == sans-donnees] }

  postgres:
    <<: *journaux
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: aster
      POSTGRES_USER: aster
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres
    secrets:
      - source: postgres_password
        target: postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [aster]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U aster -d aster]
      interval: 10s
    deploy:
      <<: *relance
      placement: { constraints: [node.hostname == aster-4] }

  ldap:
    <<: *journaux
    image: osixia/openldap:1.5.0
    command: [--copy-service]
    environment:
      LDAP_ORGANISATION: ASTER
      LDAP_DOMAIN: aster.demo
      LDAP_ADMIN_PASSWORD_FILE: /run/secrets/ldap_admin
      LDAP_TLS: 'false'
    secrets: [ldap_admin]
    configs:
      - source: ldap_utilisateurs
        target: /container/service/slapd/assets/config/bootstrap/ldif/custom/50-aster-utilisateurs.ldif
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
    networks: [aster]
    deploy:
      <<: *relance
      placement: { constraints: [node.hostname == aster-5] }

  keycloak:
    <<: *journaux
    image: ${ASTER_IMAGES}/aster-keycloak:${ASTER_TAG}
    environment:
      APP_URL: https://172.16.131.188
      KC_HOSTNAME: https://172.16.131.188:8443
      KC_HOSTNAME_ADMIN: https://172.16.131.188:8444
      KC_BOOTSTRAP_ADMIN_USERNAME: keycloak-admin
    secrets:
      - OIDC_CLIENT_SECRET
      - source: ldap_admin
        target: LDAP_ADMIN_PASSWORD
      - source: keycloak_admin
        target: KC_BOOTSTRAP_ADMIN_PASSWORD
    networks: [aster]
    deploy:
      <<: *relance
      placement: { constraints: [node.hostname == aster-5] }

  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.14
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx512m
      XPACK_MONITORING_ENABLED: 'false'
    configs:
      - source: logstash
        target: /usr/share/logstash/pipeline/logstash.conf
    secrets:
      - source: tls_journaux_cle
        target: journaux.key
      - source: tls_journaux_cert
        target: journaux.crt
    ports:
      - { target: 6514, published: 6514, mode: host }
    volumes:
      - type: bind
        source: /var/log/aster
        target: /var/log/aster
    networks: [aster]
    deploy:
      <<: *relance
      placement: { constraints: [node.hostname == aster-7] }

networks:
  aster:
    driver: overlay
    driver_opts:
      encrypted: 'true'

volumes:
  pg-data:
  ldap-data:
  ldap-config:

configs:
  haproxy:
    name: aster-haproxy-${EMPREINTE_HAPROXY}
    file: ./haproxy.cfg
  logstash:
    name: aster-logstash-${EMPREINTE_LOGSTASH}
    file: ./logstash.conf
  ldap_utilisateurs:
    name: aster-ldap-${EMPREINTE_LDAP}
    file: ../ldap/aster-utilisateurs.ldif

secrets:
  DATABASE_URL: { external: true }
  OIDC_CLIENT_SECRET: { external: true }
  SESSION_SECRET: { external: true }
  AGENT_TOKEN: { external: true }
  keycloak_admin: { external: true }
  postgres_password: { external: true }
  ldap_admin: { external: true }
  ca: { external: true }
  tls_entree: { external: true }
  tls_journaux_cle: { external: true }
  tls_journaux_cert: { external: true }
