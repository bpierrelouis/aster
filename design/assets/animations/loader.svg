<svg xmlns="http://www.w3.org/2000/svg" class="aster-loader" viewBox="0 0 128 128" role="img" aria-label="Chargement ASTER : éclosion et retrait des pétales"><title>Chargement ASTER</title><style>/* ASTER / Éclosion : ajout, respiration et retrait des pétales. */
.aster-loader{width:88px;height:88px;display:block;overflow:visible}
.aster-loader .petal{transform-origin:64px 51px;animation:aster-bloom 5.2s ease-in-out infinite both;animation-delay:calc(var(--i) * .105s)}
@keyframes aster-bloom{
  0%,3%{opacity:0;transform:translate(0px,6px) rotate(-13deg) scale(.28,.04)}
  9%{opacity:.85;transform:translate(0px,1px) rotate(-6deg) scale(.65,.62)}
  17%{opacity:1;transform:translate(0px,0px) rotate(1.8deg) scale(1.04,1.035)}
  23%{opacity:1;transform:translate(0px,0px) rotate(0deg) scale(1,1)}
  37%{opacity:1;transform:translate(0px,0px) rotate(-1.6deg) scale(.99,1.015)}
  49%{opacity:1;transform:translate(0px,0px) rotate(0deg) scale(1,1)}
  55%{opacity:.85;transform:translate(1px,2px) rotate(6deg) scale(.72,.76)}
  64%,100%{opacity:0;transform:translate(4px,8px) rotate(14deg) scale(.25,.04)}
}
.aster-loader.is-paused .petal{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.aster-loader .petal{animation:none;opacity:1;transform:none}}
