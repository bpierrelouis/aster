s="petal" style="--i:13" fill="#8670CD" d="M64 50 C56 41 53 17 62 9 C71 8 75 30 67 46 Q65 50 64 50Z"/></g><g transform="rotate(315.0 64 64)"><path class="petal" style="--i:14" fill="#A28ADC" d="M64 50 C56 41 53 17 62 9 C71 8 75 30 67 46 Q65 50 64 50Z"/></g><g transform="rotate(337.5 64 64)"><path class="petal" style="--i:15" fill="#6954C0" d="M64 50 C56 41 53 17 62 9 C71 8 75 30 67 46 Q65 50 64 50Z"/></g><circle cx="64" cy="64" r="11" fill="#E8B84E"/></svg>