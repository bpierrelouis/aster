        <text x="806" y="223" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#71717A">COMPTE WINDOWS</text>
        <text x="1054" y="223" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#71717A">DÉTECTION</text>
        <text x="1267" y="223" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#71717A">RÉSULTAT</text>
