# À chaque push sur main : tests et vérificateur documentaire, puis images publiées sur Docker Hub s'ils passent,
# puis déploiement sur les VM du démonstrateur.
# Configuration du dépôt GitHub (Settings → Secrets and variables → Actions) :
# variable DOCKERHUB_USERNAME et secret DOCKERHUB_TOKEN (jeton d'accès Docker Hub en lecture et écriture) ;
# variable DEPLOIEMENT_VM = true pour le déploiement, une fois le runner auto-hébergé installé sur orion-3.
# Recensement mobile (fonctionnalité complémentaire, jamais condition du déploiement d'ORION) : secret RELAIS_TOKEN
# (32 caractères minimum, commun au relais et au connecteur), variable RELAIS_URL (adresse HTTPS du relais) ;
# relais sur Hidora : variable HIDORA_ENV et secret HIDORA_TOKEN (jeton d'accès personnel Hidora), voir application/README.md.
# Sans cette configuration, les tests s'exécutent et la publication des images et les déploiements sont ignorés.
name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Actions épinglées par empreinte de commit (étiquette en commentaire) : une étiquette déplacée ne change pas le code exécuté
permissions:
  contents: read

# Un nouveau push annule l'exécution en cours, devenue inutile
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: application

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dependances
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:ui
      - run: npm run test:workspace
      # Traces Playwright des tests en échec, téléchargeables depuis la page de l'exécution
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-interface
          path: application/test-results/
          retention-days: 7

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dependances
      - run: npm run infra:up
      # Serveur et postes en arrière-plan, sans surveillance des fichiers ni .env : les valeurs
      # par défaut correspondent à l'infrastructure Compose. Playwright démarre lui-même l'interface.
      - run: |
          node backend/index.ts > serveur.log 2>&1 &
          node backend/demonstrateur/agents.ts > postes.log 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:3001/api/health > /dev/null && exit 0; sleep 2; done
          cat serveur.log; exit 1
      - run: npm run test:e2e
      - if: failure()
        run: cat serveur.log postes.log
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-bout-en-bout
          path: |
            application/test-results/
            application/*.log
          retention-days: 7

  # Vérificateur documentaire : condition du déploiement, comme les tests
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 .agents/skills/orion-documentation/scripts/verifier_documentation.py

  images:
    needs: [tests, e2e, documentation]
    if: github.ref == 'refs/heads/main' && vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        image: [web, api, postes, keycloak, connecteur]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: application
          target: ${{ matrix.image }}
          build-args: ORION_VERSION=${{ github.sha }}
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/orion-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Déploiement continu sur les VM du démonstrateur, joignables seulement depuis le réseau privé :
  # runner auto-hébergé (étiquette « orion ») sur la VM orion-3 (infra/vm/runner.sh), qui déploie la pile orion par SSH sur le manager orion-1.
  # Activé par la variable DEPLOIEMENT_VM = true une fois le runner installé (application/README.md).
  deploiement:
    needs: images
    if: github.ref == 'refs/heads/main' && vars.DEPLOIEMENT_VM == 'true'
    runs-on: [self-hosted, orion]
    timeout-minutes: 20
    concurrency:
      group: deploiement-vm
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash infra/vm/deployer.sh "${{ vars.DOCKERHUB_USERNAME }}" "${{ github.sha }}"
        shell: bash
        # Recensement mobile : relais (vide : connecteur non déployé) et jeton du relais, lu au premier déploiement seulement
        env:
          RELAIS_URL: ${{ vars.RELAIS_URL }}
          RELAIS_TOKEN: ${{ secrets.RELAIS_TOKEN }}

  # Relais RIGEL sur Hidora, indépendant du déploiement des VM : image de la cible relais publiée sous HIDORA_IMAGE (dépôt de
  # l'image déjà utilisée par le conteneur Hidora, par défaut <compte>/rigel), étiquetée par le commit, puis variables du
  # conteneur et redéploiement par l'API de la plateforme (Jelastic). Retour arrière : relancer ce job sur un commit précédent,
  # ou « Redeploy container » vers l'étiquette précédente dans Hidora. Base PostgreSQL et autres variables conservées.
  hidora:
    needs: [tests, documentation]
    if: github.ref == 'refs/heads/main' && vars.DOCKERHUB_USERNAME != '' && vars.HIDORA_ENV != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: deploiement-hidora
      cancel-in-progress: false
    env:
      IMAGE: ${{ vars.HIDORA_IMAGE || format('{0}/rigel', vars.DOCKERHUB_USERNAME) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: application
          target: relais
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=relais
          cache-to: type=gha,mode=max,scope=relais
      - name: Redéployer le conteneur Hidora
        env:
          API: ${{ vars.HIDORA_API || 'https://app.hidora.com' }}
          HIDORA_ENV: ${{ vars.HIDORA_ENV }}
          GROUPE: ${{ vars.HIDORA_NODE_GROUP || 'cp' }}
          HIDORA_TOKEN: ${{ secrets.HIDORA_TOKEN }}
          RELAIS_TOKEN: ${{ secrets.RELAIS_TOKEN }}
        run: |
          [ -n "$HIDORA_TOKEN" ] || { echo "Secret HIDORA_TOKEN manquant" >&2; exit 1; }
          [ ${#RELAIS_TOKEN} -ge 32 ] || { echo "Secret RELAIS_TOKEN manquant ou trop court (32 caractères minimum)" >&2; exit 1; }
          # Appel de l'API de la plateforme ; réussite : « result » nul
          appel() {
            local methode=$1; shift
            local reponse
            reponse=$(curl -sS --retry 2 "$API/1.0/environment/control/rest/$methode" --data-urlencode "session=$HIDORA_TOKEN" --data-urlencode "envName=$HIDORA_ENV" --data-urlencode "nodeGroup=$GROUPE" "$@")
            jq -e '.result == 0' <<<"$reponse" >/dev/null || { echo "$methode : $reponse" >&2; exit 1; }
          }
          variables=$(jq -nc --arg jeton "$RELAIS_TOKEN" '{NODE_ENV: "production", PORT: "3000", JELASTIC_EXPOSE: "3000", TZ: "Europe/Paris", RELAIS_TOKEN: $jeton}')
          appel addcontainerenvvars --data-urlencode "vars=$variables"
          appel redeploycontainersbygroup --data-urlencode "tag=${{ github.sha }}" --data-urlencode "useExistingVolumes=true"
      - name: Contrôler le relais
        if: vars.RELAIS_URL != ''
        env:
          RELAIS_URL: ${{ vars.RELAIS_URL }}
        run: |
          for _ in $(seq 30); do curl -sf "$RELAIS_URL/api/health" && exit 0; sleep 10; done
          echo "Le relais ne répond pas sur $RELAIS_URL/api/health" >&2; exit 1
