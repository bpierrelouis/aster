# Tests à chaque push et pull request ; images publiées sur Docker Hub depuis main.
# Configuration du dépôt GitHub : variable DOCKERHUB_USERNAME, secret DOCKERHUB_TOKEN (jeton d'accès Docker Hub).
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: application

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.22'
          cache: npm
          cache-dependency-path: application/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:ui
      - run: npm run test:workspace

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.22'
          cache: npm
          cache-dependency-path: application/package-lock.json
      - run: npm ci
      - run: npm run infra:up
      # Serveur et postes en arrière-plan ; Playwright démarre lui-même l'interface
      - run: |
          npm run dev:backend > serveur.log 2>&1 &
          npm run dev:postes > postes.log 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:3001/api/health && exit 0; sleep 2; done
          cat serveur.log; exit 1
      - run: npm run test:e2e
      - if: failure()
        run: cat serveur.log postes.log

  images:
    needs: [tests, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [web, api, postes]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: application
          target: ${{ matrix.image }}
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/aster-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
